# SonarCloud (NFR 3.7 / 3.9). Fill in the two placeholders below with your
# SonarCloud org/project (Sonar > Administration > Analysis Method gives you
# these), then set the SONAR_TOKEN secret in the GitHub repo settings — see
# .github/workflows/ci.yml's `sonar` job and docs/TESTING.md.
sonar.projectKey=CHANGE_ME_kore-repuestos
sonar.organization=CHANGE_ME_your-sonarcloud-org

sonar.sources=apps/backend/src,apps/web/src,packages/shared/src
sonar.tests=apps/backend/src,apps/web/src,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx

# Backend unit tests run without a DB (mocked repos) — coverage is generated
# by `pnpm --filter @kore/backend test:cov` in CI before the scan.
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

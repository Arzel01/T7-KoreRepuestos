server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references the hashed JS/CSS bundle — if it's ever served stale
    # (e.g. an installed PWA icon that doesn't revalidate on open), the app gets
    # stuck loading an old build indefinitely. Must always be revalidated, same
    # as the service worker + manifest below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service worker + manifest must always be revalidated, or browsers never see updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Icons are referenced by fixed, unhashed filenames (favicon, PWA/apple-touch
    # icons), unlike the hashed JS/CSS bundle — a short cache bounds staleness
    # after an icon update instead of the year-long immutable cache below.
    location ^~ /icons/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
